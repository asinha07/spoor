name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Unit, golden and MCP tests
        run: go test -race -count=1 ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start empty backends
        run: docker compose -f deploy/test/compose.yaml up -d --wait
      - name: Integration and scenario tests
        run: go test -tags integration -count=1 -v ./test/integration/
      - name: Backend logs on failure
        if: failure()
        run: docker compose -f deploy/test/compose.yaml logs --tail 200
