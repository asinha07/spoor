# Config for the messy-logs scenario (spoorgen --scenario messy-logs): logs
# shaped like real production output. Also a worked example of mapping
# non-OpenTelemetry logs; `spoor doctor` suggests most of it.
metrics:
  url: ""
traces:
  url: ""
logs:
  url: http://localhost:9428
  service_field: container
  severity_fields: [level, log.level]
  # Structured levels, plus lines whose level is only in the message text.
  error_filter: '(level:~"(?i)^(err|error|fatal|crit|critical|alert|emerg|emergency|panic|severe)$" OR log.level:~"(?i)^(err|error|fatal|crit|critical|alert|emerg|emergency|panic|severe)$" OR (NOT level:* NOT log.level:* _msg:~"^(\\S+\\s+){1,3}\\[?(ERROR|FATAL|CRITICAL|SEVERE|PANIC)\\]?[\\s:]"))'
  # This scenario's session IDs (ses_ + 8 characters) are sometimes letters only,
  # which generic ID detection cannot tell from words: name the format.
  normalize:
    - regex: '\bses_[a-z0-9]{8}\b'
      replace: 'ses_<ID>'
redact:
  - regex: '\bses_[a-z0-9]{8}\b'
    replace: 'ses_<ID>'
