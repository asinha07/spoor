# Empty VictoriaMetrics, VictoriaLogs and VictoriaTraces for integration tests
# and local experiments. Images come from Quay to avoid Docker Hub rate limits.
# Long retention lets spoorgen write scenarios hours in the past.
# The logs and traces images have no shell, so only VictoriaMetrics has a
# container health check; the integration test polls /health on all three.
services:
  victoriametrics:
    image: quay.io/victoriametrics/victoria-metrics:v1.154.0
    command: ["-retentionPeriod=100y", "-search.latencyOffset=0s"]
    ports: ["8428:8428"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 2s
      retries: 30
  victorialogs:
    image: quay.io/victoriametrics/victoria-logs:v1.53.0
    command: ["-retentionPeriod=100y"]
    ports: ["9428:9428"]
  victoriatraces:
    image: quay.io/victoriametrics/victoria-traces:v0.12.0
    command: ["-retentionPeriod=100y"]
    ports: ["10428:10428"]
