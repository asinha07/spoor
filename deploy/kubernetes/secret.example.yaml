# Example only: create the real Secret with your own values, e.g.
#   kubectl create secret generic spoor-secrets \
#     --from-literal=SPOOR_HTTP_TOKEN="$(openssl rand -hex 32)"
# Add SPOOR_METRICS_TOKEN / SPOOR_LOGS_TOKEN / SPOOR_TRACES_TOKEN if your
# backends require bearer tokens. Never commit real tokens.
apiVersion: v1
kind: Secret
metadata:
  name: spoor-secrets
  labels:
    app.kubernetes.io/name: spoor
type: Opaque
stringData:
  SPOOR_HTTP_TOKEN: change-me
