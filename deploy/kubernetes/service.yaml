apiVersion: v1
kind: Service
metadata:
  name: spoor
  labels:
    app.kubernetes.io/name: spoor
spec:
  selector:
    app.kubernetes.io/name: spoor
  ports:
    - name: http
      port: 8080
      targetPort: http
  # MCP over streamable HTTP keeps session state in the replica that answered
  # initialize; keep a client on one replica.
  sessionAffinity: ClientIP
