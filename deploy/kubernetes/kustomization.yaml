# kubectl apply -k deploy/kubernetes/   (after creating the spoor-secrets Secret)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # - networkpolicy.yaml     # optional hardening
  # - vmservicescrape.yaml   # optional, needs the VictoriaMetrics operator
images:
  - name: ghcr.io/asinha07/spoor
    newTag: latest           # pin a release, e.g. 0.1.0
